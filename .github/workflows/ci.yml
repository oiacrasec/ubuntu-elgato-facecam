name: Rust CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev ffmpeg
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Render effects
        run: cargo test --locked ffmpeg_ -- --ignored
      - name: Headless lint and tests
        run: |
          cargo clippy --locked --no-default-features --all-targets -- -D warnings
          cargo test --locked --no-default-features
      - name: Release
        run: cargo build --locked --release
      - name: Shell syntax
        run: bash -n install-desktop-app.sh uninstall-desktop-app.sh test-desktop-app.sh prepare-ai.sh
      - uses: actions/upload-artifact@v4
        with:
          name: facecam-hub-linux-x86_64
          path: target/release/elgato-virtualcam
