[package]
name = "elgato-virtualcam"
version = "3.0.0"
edition = "2024"
rust-version = "1.95"
description = "Native Facecam controller and virtual camera for Ubuntu 24.04+"
license = "MIT"

[features]
default = ["gui", "tray", "ai"]
ai = ["dep:ort", "dep:ort-sys", "dep:image", "dep:aes", "dep:cbc", "dep:sha2", "dep:tempfile"]
gui = ["dep:eframe", "dep:rfd"]
tray = ["gui", "dep:ksni"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "string"] }
ctrlc = { version = "3", features = ["termination"] }
fs2 = "0.4"
nix = { version = "0.31", features = ["signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# API 20 supports the TensorRT 10.4 runtime and the existing ONNX Runtime 1.22 fallback.
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["load-dynamic", "cuda", "tensorrt"], optional = true }
ort-sys = { version = "=2.0.0-rc.9", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"], optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"], optional = true }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1
